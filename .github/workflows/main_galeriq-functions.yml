name: Build and deploy Dockerized ASP.NET API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write     # required for OIDC login
  contents: read

env:
  AZURE_RESOURCE_GROUP: "testivcho-group"                        # Your resource group
  AZURE_WEBAPP_NAME: "GaleriqAPI-container"                 # Your Web App name
  ACR_NAME: "galeriqgaleriqapicontainerregistry"            # Your Azure Container Registry name
  ACR_LOGIN_SERVER: "galeriqgaleriqapicontainerregistry.azurecr.io"
  IMAGE_NAME: "galeriqapi"
  IMAGE_TAG: "${{ github.sha }}"
  DOTNET_VERSION: '10.0.x'
  WEBSITES_PORT: "80"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3️⃣ Build project
      - name: Build project
        shell: bash
        run: |
          dotnet build -c Release

      # 4️⃣ Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5️⃣ Login to ACR (Docker)
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # 7️⃣ Push Docker image to ACR
      - name: Push Docker image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 8️⃣ Set Web App port (if your Dockerfile exposes 80)
      - name: Set Web App port
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings WEBSITES_PORT=80

      # 9️⃣ Deploy Docker image to Web App for Containers
      - name: Deploy Docker image to Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
